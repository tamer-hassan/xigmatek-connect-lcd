# CI for a project whose whole claim is "every number in the documentation has a log
# behind it", so the jobs here are the parts of the record that can be re-derived
# without the author's hardware, and nothing pretends to re-derive the rest.
#
# What runs:
#   selftest  tools/selftest.sh, the offline suite.  No port is opened, so a runner
#             with no panel in it is exactly the right machine for it.
#   deb       dpkg-buildpackage -us -uc -b, then lintian on the result.
#   install   apt install the .deb that job just produced, on a runner that had
#             nothing of ours on it, then debian/tests/smoke - the checks that only
#             mean something once the files are in the layout an install makes.
#   release   only on a v* tag: publish the same bytes those jobs checked.
#
# Every job runs on `ubuntu-26.04`, the GitHub-hosted image for the Ubuntu release
# debian/changelog names (`resolute`) and the release the author's bench runs.  Not
# `ubuntu-latest`: while this file was written that label was still moving from 24.04
# to 26.04 (actions/runner-images#14748, roll-out 2026-10-19 to 2026-11-19), and the
# debhelper, dh-python and lintian that this packaging was measured against should not
# depend on which week a run happened in.  If that label is ever retired, the failure
# is loud - "no runner matching label" - rather than a silent distro change.
#
# What no job here does: touch /dev/ttyACM0, send a frame, or claim anything about
# real glass.  The measurements about the panel live in README.md and the docs/ set it
# links, and in PROTOCOL.md, each with the bench log they came from; a runner cannot
# re-derive those, so it does not cite them.  The two places where the suite could
# reach for hardware are guarded and stay
# guarded: the reset command runs here without --yes (xigmalcd/reset.py, and the
# suite's own pyproject section asserts "dry run: nothing sent"), and the packaged
# smoke test renders to a PNG in a temporary directory.
#
# The 146 MB themes package is not uploaded on a pull request - a reviewer of a code
# change does not need somebody else's 146 MB, and the artifact storage is not free.
# It is built on every run (so `dh_missing --fail-missing` and lintian still see it),
# uploaded and installed on a tag, and the suite re-hashes those same files from the
# checkout on every run anyway ("the vendor theme library" section).

name: package

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  selftest:
    name: offline suite, no panel
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: what the suite imports
        # Not a guessed list: PIL, pyserial and PyQt6 are what tools/selftest.sh
        # imports (its own header says so), desktop-file-utils is the one external
        # command it looks for with `command -v`, and the two font packages are what
        # xigmalcd/render.py resolves - the gauge-geometry section measures ink
        # against the ring's stroke, so it is measuring *these* glyphs.
        # requirements.txt and pyproject.toml name the same runtime deps for a pip
        # install; apt is the shorter way to the same three on this distro.
        #
        # ffmpeg is here because the GUI section asks xigmaui/clips.py for a clip's
        # luma and loop length, and those come out of ffmpeg/ffprobe decoding real
        # frames (`measure` returns 0.0 when the decode fails).  Without it the first
        # CI run failed exactly there: `AssertionError: ('Theme_25.mp4', 0.0)`,
        # 2026-11-07.  The .deb has the same thing in `Suggests: ffmpeg`, and the
        # figures the assertion compares against are the ones README and docs/ quote.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 python3-pil python3-serial python3-pyqt6 python3-setuptools \
            fonts-dejavu-core fonts-liberation desktop-file-utils ffmpeg
          python3 -c 'import PIL, serial, PyQt6.QtWidgets, sys; print(" ", sys.version.split()[0], "Pillow", PIL.__version__)'
          ffmpeg -version | head -1

      - name: tools/selftest.sh
        run: tools/selftest.sh

      - name: README's section count is the suite's section count
        # README's "Where the detail lives" page says how many offline sections the
        # suite has, docs/packaging.md repeats it, and debian/changelog says it in the
        # packaged form.  All are digits someone has to remember, so here is the
        # arithmetic: a section added without updating the prose fails CI, which is
        # cheaper than a document that quietly becomes folklore.
        run: |
          python3 - <<'PY'
          import re
          words = {"one": 1, "two": 2, "three": 3, "four": 4, "five": 5, "six": 6,
                   "seven": 7, "eight": 8, "nine": 9, "ten": 10, "eleven": 11,
                   "twelve": 12, "thirteen": 13, "fourteen": 14, "fifteen": 15,
                   "sixteen": 16, "seventeen": 17, "eighteen": 18, "nineteen": 19,
                   "twenty": 20}
          n = sum(1 for ln in open("tools/selftest.sh", encoding="utf-8")
                  if ln.startswith('echo "== '))
          where = ["README.md", "debian/changelog", "docs/packaging.md"]
          bad = []
          for path in where:
              for claim in re.findall(r"(\w+) offline sections",
                                      open(path, encoding="utf-8").read()):
                  if words.get(claim.lower()) != n:
                      bad.append((path, claim))
          if bad:
              print(f"the suite has {n} sections, but these files disagree: {bad}")
              raise SystemExit(1)
          print(f"  {n} offline sections, and README, docs/packaging.md and "
                f"debian/changelog all say so")
          PY

  deb:
    name: build the .deb files
    needs: selftest
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Build-Depends, taken out of debian/control rather than repeated here
        # Repeating them in this file would be a second list to keep honest, and
        # debian/control is the one dpkg-checkbuilddeps reads.  grep-dctrl (from
        # dctrl-tools) pulls the field out of the source stanza; the sed drops the
        # version constraints, because apt resolves those itself and
        # `debhelper-compat (= 13)` has to become a plain package name before it can be
        # an apt argument at all (into `debhelper`, by the sed below, for the reason
        # given at the end of this comment).
        #
        # The four packages installed first are not in debian/control and have to be
        # named here, and the first CI run said why in one line each.  `devscripts`
        # only *Recommends* dctrl-tools, so with --no-install-recommends grep-dctrl is
        # simply absent: the step printed "grep-dctrl: command not found", then
        # "installing:" with an empty list, and then dpkg-checkbuilddeps - correctly -
        # reported every Build-Depend unmet.  `build-essential` is a Suggests of
        # devscripts and only a Recommends of dpkg-dev, which debhelper Depends on, and
        # the ubuntu-26.04 runner image does not carry it: dpkg-checkbuilddeps named
        # "build-essential:native" among the unmet.  The empty-list guard is there
        # because a silently empty $deps is what made that run look like it was
        # installing something.  And `debhelper-compat` is mapped to `debhelper` by the
        # last sed: debian/control writes the compat level as `debhelper-compat (= 13)`,
        # a virtual that debhelper Provides with a version, and `apt-cache policy
        # debhelper-compat` on this bench answers "(none)" - so stripping `(= 13)` would
        # leave a bare virtual name sitting in an apt command line.  The compat level
        # itself stays where it is read: dpkg-checkbuilddeps, the last command in the
        # step, fails the job when debian/control and this box disagree.
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            devscripts dctrl-tools lintian build-essential
          deps=$(grep-dctrl -n -s Build-Depends '' < debian/control \
                 | tr ',' '\n' | sed -e 's/([^)]*)//g' \
                                        -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' \
                                        -e 's/^debhelper-compat$/debhelper/' \
                                        -e '/^$/d' | tr '\n' ' ')
          test -n "$deps" || { echo "no Build-Depends parsed out of debian/control"; exit 1; }
          echo "installing: $deps"
          sudo apt-get install -y --no-install-recommends $deps
          dpkg-checkbuilddeps            # the check that debian/control and this box agree
          dpkg -l debhelper dh-python pybuild-plugin-pyproject lintian \
               | awk '/^ii/{printf "  %-28s %s\n", $2, $3}'

      - name: the version, where it is written
        # debian/changelog, pyproject.toml (which is also what the wheel's METADATA
        # and the installed dist-info say) and, on a tag, the tag itself: three
        # spellings of one number, and debian/README.source promises they are kept
        # equal.  dpkg-parsechangelog prints 0.1 for this changelog.
        run: |
          set -eu
          d=$(dpkg-parsechangelog -SVersion)
          p=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          echo "debian/changelog $d, pyproject.toml $p"
          test "$d" = "$p" || { echo "the two moved apart"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ]; then
              t=${GITHUB_REF_NAME#v}
              echo "tag $GITHUB_REF_NAME -> $t"
              test "$t" = "$d" || { echo "tag and changelog disagree"; exit 1; }
          fi

      - name: dpkg-buildpackage -us -uc -b
        # -us -uc: unsigned, as debian/README.source explains - a GitHub Release
        # carries no OpenPGP signature in any case.  The artifacts land one directory
        # above the checkout, outside the source tree.
        run: dpkg-buildpackage -us -uc -b

      - name: every member of the archive carries one date, and it is the changelog's
        # The bytes of a .deb are a function of the source *and* of the clock of the
        # machine that built it.  dpkg-deb rewrites archive-member mtimes to
        # SOURCE_DATE_EPOCH - which dpkg-buildpackage sets from the top
        # debian/changelog entry - but only for members NEWER than that value: measured
        # on the bench, a member dated 05:03 local with a stamp of 03:10:42Z stayed at
        # 05:03.  That is why two builds of one commit, with md5sums and control
        # matching exactly, still came out 2 bytes apart: the runner had just checked the
        # tree out, so every file was newer than the stamp and came out uniform, while
        # this bench's working files were older and kept their own times.  debian/rules
        # now pins the staged trees to the stamp before dh_builddeb, and this step is
        # the check that it worked: one distinct date across both packages, equal to the
        # changelog's.  Cheap, and it is the precondition for the hashes in a release
        # note meaning anything to someone building from source.
        run: |
          set -euo pipefail
          stamp=$(dpkg-parsechangelog -STimestamp)
          want=$(TZ=UTC date -u -d "@$stamp" '+%Y-%m-%d %H:%M')
          echo "debian/changelog stamp: $want UTC"
          for f in ../*.deb; do
            dates=$(TZ=UTC dpkg-deb --fsys-tarfile "$f" | tar -tv | awk '{print $4, $5}' | sort -u)
            n=$(printf '%s\n' "$dates" | wc -l)
            printf '  %-46s %s distinct date(s): %s\n' "$(basename "$f")" "$n" "$(printf '%s' "$dates" | tr '\n' ';')"
            test "$n" = 1 || { echo "  more than one mtime in this archive"; exit 1; }
            [ "$dates" = "$want" ] || { echo "  not the changelog stamp ($want)"; exit 1; }
          done

      - name: lintian
        # --tag-display-limit 0 so nothing is folded away ("and 7 more"), and the
        # gate is errors *and* warnings: the build on the author's bench measured 0
        # errors, 0 warnings, 0 info (2026-11-07, lintian 2.129.0ubuntu2.1), and what
        # this project does with a new tag is fix it or explain it in
        # debian/xigmatek-connect-lcd.lintian-overrides, not silence it.  An info is
        # printed and not failed on, because infos are lintian's opinions about a
        # future policy, not a defect in these bytes.
        run: |
          set -euo pipefail
          lintian --tag-display-limit 0 --fail-on error,warning ../*.changes \
            | tee "$GITHUB_WORKSPACE/../lintian.log"
          {
            echo "lintian $(lintian --version | head -1)"
            echo "run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "errors=$(grep -c '^E:' "$GITHUB_WORKSPACE/../lintian.log" || true) warnings=$(grep -c '^W:' "$GITHUB_WORKSPACE/../lintian.log" || true) infos=$(grep -c '^I:' "$GITHUB_WORKSPACE/../lintian.log" || true)"
          } | tee "$GITHUB_WORKSPACE/../lintian-summary.txt"

      - name: what came out of the build
        run: |
          ls -l ../*.deb ../*.changes ../*.buildinfo
          dpkg-deb -I ../xigmatek-connect-lcd_*_all.deb | sed -n '1,3p'
          dpkg-deb -c ../xigmatek-connect-lcd_*_all.deb | grep -c '^-[^d]' \
            | sed 's/^/  code package, files: /'
          dpkg-deb -c ../xigmatek-connect-lcd-themes_*_all.deb | grep -c '^-[^d]' \
            | sed 's/^/  themes package, files: /'

      - name: collect what the build wrote, inside the workspace this time
        # dpkg-buildpackage writes its artifacts one directory above the source tree,
        # which is normal and is what debian/README.source tells a packager to expect.
        # It is not something actions/upload-artifact will read: the first attempt at
        # this step failed before looking for any file -
        #   Invalid pattern '../xigmatek-connect-lcd_*_all.deb'.
        #   Relative pathing '.' and '..' is not allowed.
        # So the files are copied into the workspace, into two directories rather than
        # one because the second one is the 146 MB that a pull request does not need to
        # download.  Nothing here is rebuilt or re-compressed: these are the same bytes
        # lintian just checked and the install job below will install.
        run: |
          set -eu
          mkdir -p pkg-code pkg-themes
          cp ../*.changes ../*.buildinfo ../lintian.log ../lintian-summary.txt pkg-code/
          mv ../xigmatek-connect-lcd_*_all.deb pkg-code/
          mv ../xigmatek-connect-lcd-themes_*_all.deb pkg-themes/
          ls -l pkg-code pkg-themes

      - uses: actions/upload-artifact@v7
        with:
          name: deb-code
          path: pkg-code/
          compression-level: 0        # already xz'd inside the .deb
          retention-days: 14
          if-no-files-found: error

      # Only on a tag, and only because the install job below then gets to check the
      # 146 MB against manifest.json on a machine that has never seen this tree.
      - uses: actions/upload-artifact@v7
        if: github.ref_type == 'tag'
        with:
          name: deb-themes
          path: pkg-themes/
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

  install:
    name: apt install them, then debian/tests/smoke
    needs: deb
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: deb-code
          path: debs

      - uses: actions/download-artifact@v8
        if: github.ref_type == 'tag'
        with:
          name: deb-themes
          path: debs

      - name: install
        # Two things deliberately not left to apt's defaults.
        #
        # python3-pyqt6 is a Suggest, not a Depends, precisely because the display
        # loop runs without Qt - so apt will not pull it in here, and the smoke test
        # would spend the run reporting SKIPPED for the window's --help and for
        # QIcon.fromTheme.  Installing it makes that half of the test real.
        #
        # The .deb files are installed from ./debs in one command, which is what lets
        # apt see that the code package's `Recommends: xigmatek-connect-lcd-themes
        # (= 0.1)` is satisfiable by the other file on the same command line.  When
        # only the code package is present (a pull request), apt plans the install and
        # prints `Recommended packages: xigmatek-connect-lcd-themes` without failing;
        # that was checked on the bench with `apt-get -s install`, not assumed.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            desktop-file-utils python3-pyqt6
          sudo apt-get install -y ./debs/*.deb
          dpkg-query -W -f='${Package} ${Version} ${Architecture} installed-size ${Installed-Size} KB\n' \
            'xigmatek-connect-lcd*'

      - name: debian/tests/smoke
        # The same script autopkgtest would run (debian/tests/control); run directly
        # here because autopkgtest wants to build its own container or VM and this job
        # already is a clean machine with the packages installed.
        run: debian/tests/smoke

  release:
    name: publish the .deb files on the tag
    needs: [deb, install]
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: deb-code
          path: debs

      - uses: actions/download-artifact@v8
        with:
          name: deb-themes
          path: debs

      - name: the assets, with their sizes and hashes
        id: assets
        run: |
          set -eu
          for f in debs/*.deb; do
              printf '| `%s` | %s B | `%s` |\n' "$(basename "$f")" \
                  "$(stat -c %s "$f")" "$(sha256sum "$f" | cut -d' ' -f1)"
          done | tee "$RUNNER_TEMP/assets.md"

      - name: notes
        # Everything in here is either a fact about the two files or a pointer to the
        # run that checked them.  What the panel-facing claims rest on is README, the
        # docs/ set it links and PROTOCOL.md's own bench logs, and this says so rather
        # than borrowing their
        # authority.
        run: |
          set -eu
          {
            echo "Unofficial: not affiliated with, endorsed by or approved by"
            echo "XIGMATEK. The display loop says the same thing on the panel."
            echo
            echo "Two .deb files, built by this run from the tree at this tag on"
            echo "\`ubuntu-26.04\` (\`dpkg-buildpackage -us -uc -b\`, no OpenPGP"
            echo "signature - the hashes below and HTTPS are what a release asset"
            echo "carries).  Those hashes are reproducible from the source: every"
            echo "archive member is dated from \`debian/changelog\`, so a build of"
            echo "this tag on the same distro and dpkg version gives these same"
            echo "bytes.  docs/packaging.md keeps that measurement, including the"
            echo "machine whose clock was leaking before it was made."
            echo
            echo "| file | bytes | sha256 |"
            echo "|---|---|---|"
            cat "$RUNNER_TEMP/assets.md"
            echo
            echo '```'
            # the lintian summary came back inside the artifact this job downloaded,
            # not from the build job's own disk - that machine is gone by now
            cat debs/lintian-summary.txt
            echo '```'
            echo
            echo "Install both, in one command, from the directory holding them:"
            echo
            echo '```bash'
            echo 'sudo apt install ./xigmatek-connect-lcd_*.deb ./xigmatek-connect-lcd-themes_*.deb'
            echo 'sudo loginctl enable-linger "$USER"'
            echo 'systemctl --user start xigmalcd.service'
            echo '```'
            echo
            echo "Two things that install deliberately does not do. It *enables* the"
            echo "user unit - the one line \`Setting up xigmatek-connect-lcd\` prints is"
            echo "a symlink into \`/etc/systemd/user/default.target.wants/\` - without"
            echo "starting it, and its \`ExecStart\` is \`/usr/bin/xigmalcd --theme alpha"
            echo "--fps 2\`, so starting it makes that process the only holder of"
            echo "/dev/ttyACM0. And it drops the udev rule into"
            echo "/usr/lib/udev/rules.d without asking udev to read it, so the stable"
            echo "\`/dev/xigmatek-lcd\` symlink and the ModemManager quieting arrive at"
            echo "the next replug - or now, by hand:"
            echo
            echo '```bash'
            echo 'sudo udevadm control --reload-rules && sudo udevadm trigger --action=change'
            echo '```'
            echo
            echo "The window needs PyQt6, which the package only Suggests:"
            echo "\`sudo apt install python3-pyqt6\`. Without it, \`xigmaui\` exits 2 with"
            echo "two lines saying what to install and no traceback; the display loop"
            echo "is unaffected either way, which is why it is a Suggest."
            echo
            echo "The themes package is optional and separate on purpose: it is"
            echo "XIGMATEK's own library, copied byte for byte out of the vendor"
            echo "installation and hashed by its own \`.json\` manifest so the copy can"
            echo "be checked rather than trusted. \`debian/copyright\` in the source"
            echo "tree says what was done to obtain those files; nothing here licenses"
            echo "them."
            echo
            echo "Nothing in this run touches a panel. The offline suite"
            echo "(\`tools/selftest.sh\`), the build, \`lintian\`, and the post-install"
            echo "checks (\`debian/tests/smoke\`) all pass with no serial port present,"
            echo "and the suite's own reset gate check asserts that \`xigmalcd-reset\`"
            echo "without \`--yes\` prints the frame and sends nothing."
            echo
            echo "The same install-and-check pair has also been run on real hardware"
            echo "that happens to be a desktop rather than a runner: the author's bench,"
            echo "\`sudo apt install\` of both files followed by \`debian/tests/smoke\`"
            echo "printing \`all installed checks passed\`. That transcript is tracked at"
            echo "\`docs/packaging/smoke-2026-11-07.log\`, hashes of the files it"
            echo "installed included. What neither the runner nor the bench judges from"
            echo "these bytes is the glass itself - README, its docs/ set and"
            echo "PROTOCOL.md carry those claims, each with the bench log it was read"
            echo "out of."
            echo "claims, each with the bench log it was read out of."
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: gh release create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            debs/*.deb debs/*.changes debs/*.buildinfo
          gh release view "$GITHUB_REF_NAME" --json name,assets \
            --jq '.name + ": " + ([.assets[].name] | join(", "))'
