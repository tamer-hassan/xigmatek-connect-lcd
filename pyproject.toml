[project]
name = "xigmalcd"
version = "0.4"
description = "Show Linux system stats on the LCD built into Xigmatek Connect AIO coolers"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pyserial>=3.5", "pillow>=9.0"]

# The SPDX form (a string, plus `license-files`) is PEP 639, which setuptools
# understood from 77.  Earlier setuptools silently ignored `license-files` and
# would build a wheel whose METADATA claimed no licence file at all, so the build
# requirement is raised rather than left at 61 - and tools/selftest.sh reads this
# file back and compares the declaration with the LICENSE on disk.
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]

# The window needs Qt and the display loop does not, so it is an extra rather
# than a dependency: `pip install .` gives you `xigmalcd`, `pip install .[gui]`
# gives you both.  install/install.sh does not use pip for this - it checks
# `import PyQt6` and names the distro package when Qt is missing.
[project.optional-dependencies]
gui = ["PyQt6>=6.4"]

# One more entry point than there are programs: `xigmalcd-reset` is the vendor's
# `recovery`, the request that re-enumerates the USB device and drops the panel's
# stored background.  It is here because a person with an installed system and a
# white panel otherwise has no way back (`logo`/`mode` cannot be set from the wire),
# and it sends nothing without --yes.  xigmalcd/reset.py is the implementation and
# the provenance; tools/reset_panel.py is the checkout spelling of the same command.
[project.scripts]
xigmalcd = "xigmalcd.main:main"
xigmaui = "xigmaui.__main__:run"
xigmalcd-reset = "xigmalcd.reset:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["xigmalcd", "xigmaui"]
